# Render 블루프린트: 대시보드에서 New → Blueprint → 이 저장소를 고르면 아래대로 만든다.
services:
  - type: web
    name: health-itda
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/users/me
    autoDeploy: true
    envVars:
      # 키 값은 저장소에 적지 않는다. 처음 만들 때 대시보드에서 입력한다.
      - key: DATA_GO_KR_KEY
        sync: false
      - key: JUSO_API_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
